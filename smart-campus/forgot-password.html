<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Campus</title>
    <!-- Connect CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 6px;
        }
        .feedback-message {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .feedback-error {
            background: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
        }
        .feedback-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
    </style>
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔑</div>
            <h2>Reset Your Password</h2>
            <p>Enter your registered campus email to verify your account and set a new password.</p>
        </div>

        <!-- Feedback Alert Container -->
        <div id="feedbackAlert" class="feedback-message"></div>

        <!-- STEP 1: VERIFY EMAIL FORM -->
        <form id="forgotPasswordForm">
            <div style="margin-bottom: 1rem; font-weight: 700; font-size: 0.9rem; color: var(--dark); display: flex; align-items: center;">
                <span class="step-badge">1</span> Verify Registered Account
            </div>

            <div class="form-group">
                <label for="forgotEmail">Campus Email Address *</label>
                <input 
                    type="email" 
                    id="forgotEmail" 
                    placeholder="e.g., student@campus.edu or faculty@campus.edu" 
                    required
                >
            </div>

            <button type="submit" id="verifyEmailBtn" class="btn btn-primary" style="width: 100%;">
                🔍 Verify Email Address
            </button>
        </form>

        <!-- STEP 2: SET NEW PASSWORD FORM (Initially Hidden) -->
        <form id="resetPasswordForm" style="display: none; margin-top: 1rem;">
            <div style="margin-bottom: 1rem; font-weight: 700; font-size: 0.9rem; color: var(--dark); display: flex; align-items: center;">
                <span class="step-badge">2</span> Set New Password
            </div>

            <div class="form-group">
                <label>Verified Email</label>
                <input 
                    type="email" 
                    id="verifiedEmailDisplay" 
                    readonly 
                    style="background: #f8fafc; color: var(--text-muted); cursor: not-allowed;"
                >
            </div>

            <div class="form-group">
                <label for="newPassword">New Password *</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    placeholder="Enter new password (min. 4 characters)" 
                    required
                    minlength="4"
                >
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password *</label>
                <input 
                    type="password" 
                    id="confirmNewPassword" 
                    placeholder="Re-enter new password" 
                    required
                    minlength="4"
                >
            </div>

            <input type="hidden" id="resetTokenValue" value="">

            <button type="submit" id="resetPasswordBtn" class="btn btn-primary" style="width: 100%;">
                🔒 Update & Save New Password
            </button>
        </form>

        <div class="auth-footer" style="margin-top: 1.5rem;">
            <p>Remembered your password? <a href="login.html">Sign In Here</a></p>
            <p style="margin-top: 0.5rem;"><a href="index.html">← Back to Homepage</a></p>
        </div>
    </div>

    <!-- Connect JS -->
    <script src="js/auth.js"></script>
</body>
</html>
